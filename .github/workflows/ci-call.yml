name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run-ci:
    strategy:
      matrix:
        os: [ubuntu-latest]
        # Floor and ceiling. They coincide when a project targets its own
        # minimum, and a matrix must not then run the same version twice.
        python-version: ["3.11", "3.13"]

    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      github.actor != 'github-actions[bot]' &&
      !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'bump:'))

    uses: AllenNeuralDynamics/galen-uv-workflows/.github/workflows/ci.yml@v2
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      package-name: aind_atlas_terminology
      run-mypy: true
    secrets:
      # Passed on to `uv sync` as a git `url.insteadOf` credential, so
      # internal or private git dependencies pinned in [tool.uv.sources]
      # can be cloned. Harmless to leave in when all deps are public.
      repo-token: ${{ secrets.GITHUB_TOKEN }}

  # The shared workflow's steps assume bash, so other platforms run the tests directly.
  test-other-platforms:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    name: Test (Py ${{ matrix.python-version }} on ${{ matrix.os }})
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      github.actor != 'github-actions[bot]' &&
      !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'bump:'))
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen pytest
